# ---------------------------------------------------------------------------
# Defaults. Values that come from Terraform outputs (image repository, cert ARN)
# are injected by infra/scripts/app-deploy.sh rather than committed here, so the
# chart never drifts from the live stack.
# ---------------------------------------------------------------------------

image:
  # Set by app-deploy.sh from `terraform output ecr_repository_url`.
  repository: ""
  # Overridden per deploy with the git sha. "latest" is a fallback, not a habit:
  # a mutable tag makes a rollback impossible to describe.
  tag: latest
  pullPolicy: IfNotPresent

# The Secret is created by Terraform (infra/eks/secrets.tf), not by this chart —
# the RDS password is generated there and must not travel through helm values.
# Supplies DJANGO_SECRET_KEY, DATABASE_URL, OPENAI_API_KEY.
existingSecret: frikkinwave-prod-secrets

# Non-secret configuration. Rendered into a ConfigMap and consumed with envFrom.
config:
  DJANGO_SETTINGS_MODULE: config.settings.production
  # The ALB forwards the public hostname; the pod's own IP is appended at
  # runtime from the downward API (see production.py).
  ALLOWED_HOSTS: api.frikkinwave.com
  CORS_ALLOWED_ORIGINS: https://frikkinwave.com,https://www.frikkinwave.com
  CSRF_TRUSTED_ORIGINS: https://api.frikkinwave.com,https://frikkinwave.com
  # In-cluster Redis, addressed by its Service DNS name.
  CELERY_BROKER_URL: redis://frikkinwave-redis:6379/0
  # Semantic-search relevance floor. 0.8 is unusable for text-embedding-3-small.
  SEARCH_SIMILARITY_THRESHOLD: "0.4"
  # How the outbox relay hands events off: celery | kafka. Defaults to celery so
  # deploying stage 3 changes nothing. Flip live, no image rebuild:
  #   helm upgrade ... --reset-then-reuse-values --set config.EVENT_TRANSPORT=kafka
  # and flip straight back if anything looks wrong.
  EVENT_TRANSPORT: celery
  KAFKA_BOOTSTRAP_SERVERS: frikkinwave-kafka-bootstrap.kafka.svc.cluster.local:9093
  # mTLS: SSL, not SASL_SSL. There is no SASL mechanism, no username and no
  # password — the client certificate below IS the identity, and Kafka authorizes
  # its subject (CN=frikkinwave-app).
  KAFKA_SECURITY_PROTOCOL: SSL
  KAFKA_SSL_CA_LOCATION: /etc/kafka-ca/ca.crt
  KAFKA_SSL_CERTIFICATE_LOCATION: /etc/kafka-user/user.crt
  KAFKA_SSL_KEY_LOCATION: /etc/kafka-user/user.key
  # gunicorn workers per pod. Each forks a full Django process (~150 MB), so
  # this is bounded by the memory limit below, not by CPU.
  WEB_CONCURRENCY: "2"

web:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 640Mi

# ---------------------------------------------------------------------------
# Celery workers — one Deployment per queue.
#
# A map rather than three near-identical blocks: adding a service is a queue and
# a few limits, not another template. Each key becomes a Deployment named
# <release>-<key>.
#
# The split is the point. Everything shared one queue and one worker until the
# notifications and search extractions; a slow mail provider or a stalled OpenAI
# call could stall feed fan-out behind it.
#
# NOTE: a task routed to a queue that appears in no entry here is enqueued and
# never executed, with no error anywhere. tests/test_architecture.py reads this
# map and fails the build on that drift.
# ---------------------------------------------------------------------------
workers:
  # General: feed fan-out, rating rollups, the outbox relay.
  worker:
    enabled: true
    # This Deployment runs events.relay_outbox, so it is the only worker that
    # needs Kafka credentials when EVENT_TRANSPORT=kafka.
    runsOutboxRelay: true
    replicaCount: 1
    concurrency: 2
    queues: celery
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Extracted service — email delivery. Almost entirely waiting on SMTP, so
  # concurrency buys a lot per unit of memory.
  notifications:
    enabled: true
    replicaCount: 1
    concurrency: 4
    queues: notifications
    resources:
      requests:
        cpu: 50m
        memory: 224Mi
      limits:
        cpu: 300m
        memory: 384Mi

  # Extracted service — profile embedding. Spiky and bound by OpenAI latency,
  # which is precisely why it must not share a queue with anything user-facing.
  search:
    enabled: true
    replicaCount: 1
    concurrency: 2
    queues: search
    resources:
      requests:
        cpu: 50m
        memory: 224Mi
      limits:
        cpu: 300m
        memory: 448Mi

# ---------------------------------------------------------------------------
# Kafka client (KAFKA.md stage 3).
#
# `enabled` only controls whether the CREDENTIALS are mounted. What the app
# actually does is decided by config.EVENT_TRANSPORT below — mounting a secret
# changes no behaviour, so these can be rolled out separately and the transport
# flipped afterwards with a one-line `helm upgrade --set`.
#
# Both Secrets are mirrored into this namespace by Terraform (infra/eks/kafka.tf):
# Strimzi creates them in the `kafka` namespace and Secrets cannot cross one.
# ---------------------------------------------------------------------------
kafka:
  enabled: true
  userSecret: kafka-app-user
  caSecret: kafka-cluster-ca
  caMountPath: /etc/kafka-ca
  userMountPath: /etc/kafka-user
  # Must match the image's uid (Dockerfile: `useradd --uid 10001 appuser`).
  # This is what makes the 0440 client key readable by a non-root container.
  fsGroup: 10001

redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

migrations:
  enabled: true
  # Generous: a migration that needs a table rewrite should not be killed halfway.
  backoffLimit: 1
  activeDeadlineSeconds: 600
  # Keep finished Jobs for a day, then let the TTL controller remove them.
  ttlSecondsAfterFinished: 86400

# `manage.py relay_outbox` — the sweep that makes event delivery guaranteed.
# The post-commit nudge is best-effort and is lost if the process dies between
# COMMIT and the enqueue; this is what recovers those.
outboxRelay:
  enabled: true
  schedule: "*/5 * * * *"

ingress:
  enabled: true
  host: api.frikkinwave.com
  # Set by app-deploy.sh from `terraform output acm_certificate_arn`.
  certificateArn: ""
  # A stable ALB name keeps the Route 53 alias pointing at the same target
  # across chart upgrades.
  loadBalancerName: frikkinwave-prod
  # Subnet IDs, injected by app-deploy.sh from the Terraform output. A LIST, not
  # a comma-joined string: helm's --set splits on commas, so a string value has
  # to be backslash-escaped at every call site. Empty falls back to tag-based
  # discovery.
  subnets: []
