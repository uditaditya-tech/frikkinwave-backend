apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frikkinwave.fullname" . }}-worker
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frikkinwave.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "frikkinwave.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: {{ include "frikkinwave.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - config
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.concurrency }}
          envFrom:
            {{- include "frikkinwave.envFrom" . | nindent 12 }}
          env:
            {{- include "frikkinwave.podIpEnv" . | nindent 12 }}
          # No readiness probe: the worker serves no traffic, so there is
          # nothing for a Service to gate on. Liveness asks the worker to answer
          # its own control ping, which catches a process that is up but has
          # lost the broker.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 45
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
