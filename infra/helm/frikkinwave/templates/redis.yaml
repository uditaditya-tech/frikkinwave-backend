{{- if .Values.redis.enabled }}
# ---------------------------------------------------------------------------
# Celery broker — in-cluster rather than ElastiCache.
#
# Saves ~$13/mo, and later gives KEDA an in-cluster queue to watch when the
# worker scales to zero.
#
# No PersistentVolume, deliberately. A restart drops every queued task, which is
# survivable *because of the transactional outbox*: events are committed to
# Postgres alongside the state change they describe, and `manage.py
# relay_outbox` (the CronJob) re-dispatches anything still unpublished. Redis
# holds a cache of work in flight, not the record of it.
#
# If that stops being true — user-visible work that only ever exists in the
# queue — this should move back to ElastiCache with persistence.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    # Never run two brokers at once against the same Service name.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "frikkinwave.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Name is load-bearing: CELERY_BROKER_URL in values.yaml resolves this.
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
{{- end }}
