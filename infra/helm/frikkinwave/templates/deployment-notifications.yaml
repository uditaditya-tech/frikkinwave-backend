{{- if .Values.notifications.enabled }}
# ---------------------------------------------------------------------------
# Notifications — the first extracted service.
#
# It runs the same image as the monolith but consumes only the `notifications`
# queue, and its handlers (apps/notifications/tasks.py) touch no models at all:
# every event payload carries the facts the email needs. That is the property
# that makes this an extraction rather than a relocated function call — point it
# at a broker and it needs nothing else from this process.
#
# Still shared: the image and the database *configuration*. It simply no longer
# uses the latter. Giving it its own image is packaging work, not design work.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frikkinwave.fullname" . }}-notifications
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  replicas: {{ .Values.notifications.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frikkinwave.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: notifications
  template:
    metadata:
      labels:
        {{- include "frikkinwave.labels" . | nindent 8 }}
        app.kubernetes.io/component: notifications
    spec:
      containers:
        - name: notifications
          image: {{ include "frikkinwave.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - config
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.notifications.concurrency }}
            - --queues={{ .Values.notifications.queues }}
          envFrom:
            {{- include "frikkinwave.envFrom" . | nindent 12 }}
          env:
            {{- include "frikkinwave.podIpEnv" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A config inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 45
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.notifications.resources | nindent 12 }}
{{- end }}
