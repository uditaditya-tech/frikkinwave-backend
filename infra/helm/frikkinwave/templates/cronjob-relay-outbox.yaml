{{- if .Values.outboxRelay.enabled }}
# ---------------------------------------------------------------------------
# The outbox sweep — what makes event delivery *guaranteed*.
#
# publish() writes the event row inside the caller's transaction and fires a
# best-effort nudge on commit. That nudge is lost if the process dies between
# COMMIT and the enqueue, or if the broker is briefly unreachable. This sweep is
# the backstop that finds those rows and dispatches them.
#
# Nothing scheduled it before this phase, so the guarantee was theoretical.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "frikkinwave.fullname" . }}-relay-outbox
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  schedule: {{ .Values.outboxRelay.schedule | quote }}
  # Two sweeps at once would contend on the same rows. They would not double
  # -deliver — relay_pending() takes SELECT ... FOR UPDATE SKIP LOCKED, and
  # consumers are idempotent anyway — but there is no reason to pay for it.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # If a run is missed (no nodes, cluster down), don't stampede the backlog.
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "frikkinwave.labels" . | nindent 12 }}
            app.kubernetes.io/component: relay
        spec:
          restartPolicy: Never
          {{- if .Values.kafka.enabled }}
          securityContext:
            {{- include "frikkinwave.kafkaPodSecurityContext" . | nindent 12 }}
          {{- end }}
          containers:
            - name: relay
              image: {{ include "frikkinwave.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "manage.py", "relay_outbox"]
              envFrom:
                {{- include "frikkinwave.envFrom" . | nindent 16 }}
              env:
                {{- include "frikkinwave.podIpEnv" . | nindent 16 }}
                {{- include "frikkinwave.kafkaEnv" . | nindent 16 }}
              {{- if .Values.kafka.enabled }}
              volumeMounts:
                {{- include "frikkinwave.kafkaVolumeMounts" . | nindent 16 }}
              {{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  cpu: 300m
                  memory: 384Mi
          {{- if .Values.kafka.enabled }}
          volumes:
            {{- include "frikkinwave.kafkaVolumes" . | nindent 12 }}
          {{- end }}
{{- end }}
