apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frikkinwave.fullname" . }}-web
  labels:
    {{- include "frikkinwave.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  # Three is enough to roll back through; the default of 10 just leaves
  # scaled-to-zero ReplicaSets cluttering `kubectl get rs`.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frikkinwave.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "frikkinwave.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      # Spread replicas so losing one node — or one availability zone — cannot
      # take out the whole web tier.
      #
      # The two constraints have deliberately different strictness:
      #
      #   hostname: DoNotSchedule. Two replicas on one node is never acceptable
      #     and is always avoidable, since the node group runs >= 2 nodes.
      #
      #   zone: ScheduleAnyway. It would be nice to make this hard too, but AWS
      #     capacity is not guaranteed — ap-south-1a had no t4g.small at all
      #     when this cluster was built. A hard zone constraint would leave
      #     replicas Pending and the site down rather than merely non-HA. The
      #     scheduler still prefers spreading; it just will not refuse to run.
      #
      # matchLabelKeys: [pod-template-hash] is load-bearing. Spread is evaluated
      # only at scheduling time and counts every matching pod, so during a
      # rolling update the OLD revision's pods shape the skew for the new ones.
      # Both new replicas then legally land on one node, and when the old pods
      # go away nothing rebalances — Kubernetes never relocates a running pod.
      # Scoping the calculation to the pod's own revision makes the constraint
      # mean what it looks like it means. (Observed exactly this failure here.)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "frikkinwave.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "frikkinwave.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: web
      containers:
        - name: web
          image: {{ include "frikkinwave.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          envFrom:
            {{- include "frikkinwave.envFrom" . | nindent 12 }}
          env:
            {{- include "frikkinwave.podIpEnv" . | nindent 12 }}
          # /api/health/ is exempt from SECURE_SSL_REDIRECT (production.py), so
          # a plain-HTTP probe gets 200 rather than a 301 the kubelet counts as
          # a failure.
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
