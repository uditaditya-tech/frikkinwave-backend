# ---------------------------------------------------------------------------
# Kafka cluster values.
#
# tests/test_infrastructure.py asserts on the durability and scheduling keys
# below and cross-checks them against the Terraform stack. They are not free
# parameters — read the comments before changing one.
# ---------------------------------------------------------------------------

# The Kafka cluster name. Becomes the prefix for every generated resource, and
# the bootstrap Service is <name>-kafka-bootstrap.
clusterName: frikkinwave

# Broker version. Strimzi only ships images for versions it was built against —
# 1.1.0 supports 4.2.0, 4.2.1 and 4.3.0. Naming an unsupported version leaves
# the Kafka resource stuck NotReady with the reason in the operator log.
kafkaVersion: "4.2.1"

# ---------------------------------------------------------------------------
# Node pool.
#
# One pool with BOTH roles: in KRaft the controller quorum is a Kafka role, not
# a separate ZooKeeper ensemble. Combining them means 3 pods instead of 6, which
# is what makes this fit on three t4g.medium nodes. Split the roles into two
# pools when the cluster is big enough that a busy broker starving the
# controller quorum is a real risk; at this scale it is not.
# ---------------------------------------------------------------------------
nodePool:
  name: dual-role
  # 3 is the floor for the replication settings below to be satisfiable, and it
  # matches node_desired_size so the hostname spread can place them.
  replicas: 3
  roles:
    - controller
    - broker

storage:
  size: 10Gi
  # Must name a StorageClass the cluster actually has. Terraform creates gp3 in
  # infra/eks/ebs-csi.tf; naming anything else parks every broker Pending
  # forever with no error above the PVC. Asserted by the tests.
  class: gp3
  # true — the volumes are recreated from replicas on the next bring-up, and a
  # retained EBS volume on a torn-down cluster is a silent bill. See the Kafka
  # teardown block in infra/scripts/eks-down.sh.
  deleteClaim: true

resources:
  requests:
    cpu: 250m
    memory: 1280Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

# Heap is set explicitly and deliberately well under the memory limit. Kafka
# relies on the OS page cache for read throughput, so handing the JVM the whole
# container is actively counterproductive — and a heap that can grow into the
# limit gets the pod OOMKilled rather than throwing OutOfMemoryError.
jvm:
  xms: 1g
  xmx: 1g

# ---------------------------------------------------------------------------
# Security.
#
# The listener is TLS + SCRAM-SHA-512 + ACLs, not plaintext. It was plaintext
# with no authentication until 2026-08-19, which meant any pod in the cluster
# could read every topic simply by being a Kafka client — and Strimzi's own
# NetworkPolicy left port 9092 unrestricted (`from: null`), so network isolation
# would not have closed it either.
#
# The order here follows Kafka's own security model and NIST SP 800-207: encrypt
# in transit, authenticate the client, then authorize it. Network isolation is a
# second layer under it, never the control itself — "inside the cluster" is not
# an authorization signal.
#
# `authorization.type: simple` DENIES BY DEFAULT. An authenticated client with no
# ACLs can do nothing, which is what makes the KafkaUser below meaningful.
# ---------------------------------------------------------------------------
security:
  listenerName: tls
  listenerPort: 9093
  # mTLS, not SCRAM.
  #
  # SCRAM shipped first and worked, but it is a shared secret: it sits in a
  # Secret, gets mirrored across namespaces, and rotating it means coordinating
  # every client. With mTLS the client proves possession of a private key that
  # never leaves its pod, Strimzi issues and renews the certificate, and the
  # principal (CN=<user>) is the certificate itself rather than a string anyone
  # holding the Secret can replay.
  #
  # `authType` drives BOTH the listener and the KafkaUser — they must agree, and
  # a test asserts they do. Valid: tls | scram-sha-512.
  authType: tls
  # Namespaces allowed to reach the listener at all. Defence in depth beneath
  # SCRAM — not a substitute for it.
  #   kafka       — brokers reach each other, and kubectl-exec CLI runs here.
  #   frikkinwave — nothing there talks to Kafka yet; stage 3 producers will,
  #                 and a silently blocked producer later is a worse failure
  #                 than an anticipatory rule documented now.
  allowedNamespaces:
    - kafka
    - frikkinwave

# The application's Kafka identity. Stage 3 mounts the generated Secret
# (`frikkinwave-app`) and connects with it; nothing uses it yet.
appUser: frikkinwave-app

# Consumer groups the app user may join. Stage 4 gives each extracted service
# its own group; the prefix keeps that from needing an ACL change per service.
consumerGroupPrefix: frikkinwave

# ---------------------------------------------------------------------------
# Event topics.
#
# MUST match apps/events/registry.py exactly — tests/test_infrastructure.py
# compares the two and fails the build on drift. They are declared here because
# ACLs need names: an authorization rule over a topic the chart does not know
# about cannot be written, and `simple` authorization denies anything ungranted.
# ---------------------------------------------------------------------------
# Dead-letter suffix. MUST match KAFKA_DLT_SUFFIX in config/settings/base.py —
# the consumer produces to <topic><suffix>, and `authorization: simple` denies
# any topic not granted below, so a mismatch turns every dead-letter into a
# stalled partition. A test compares the two.
dltSuffix: ".dlt"

topics:
  - activity.recorded
  - band.invite_accepted
  - band.invite_created
  - contact_request.accepted
  - contact_request.created
  - engagement.accepted
  - engagement.requested
  - follow.created
  - follow.removed
  - listing.application_accepted
  - listing.application_created
  - profile.updated
  - review.created

# ---------------------------------------------------------------------------
# Durability. From KAFKA.md: "anything less and the durability story is theatre."
#
# replicationFactor 3 + minInsyncReplicas 2 is the pairing that matters: three
# copies, and a producer with acks=all needs two of them to acknowledge. That
# tolerates one broker down with writes still accepted, and one broker down
# with no data loss. Setting minInsyncReplicas to 1 would keep writes flowing
# during a failure while quietly giving up the guarantee.
# ---------------------------------------------------------------------------
durability:
  replicationFactor: 3
  minInsyncReplicas: 2

topology:
  # HARD across nodes: two brokers on one node means one node failure takes out
  # two of three replicas, and min.insync.replicas 2 can no longer be met —
  # the cluster stops accepting writes. This is the constraint worth failing to
  # schedule over.
  nodeSpread: DoNotSchedule
  # SOFT across zones, deliberately, and NOT what KAFKA.md's "one per AZ"
  # implies. ap-south-1a had zero t4g.small capacity when this cluster was
  # built, which is the whole reason node_instance_types is a list. A hard zone
  # constraint converts that capacity shortfall into a broker stuck Pending
  # indefinitely. ScheduleAnyway spreads across AZs whenever it can and
  # degrades to running rather than not running when it cannot.
  zoneSpread: ScheduleAnyway

# The Topic Operator reconciles KafkaTopic resources into real topics, so a
# topic is a manifest under review rather than a shell command someone ran once.
# Stage 4 declares its topics this way.
entityOperator:
  enabled: true

  # BOTH operators. The Topic Operator reconciles KafkaTopic; the User Operator
  # reconciles KafkaUser — and without the latter a KafkaUser is inert in the
  # most misleading way available: `kubectl get kafkauser` shows the object with
  # its auth type and ACLs, nothing errors, and no SCRAM credential is ever
  # created in Kafka and no Secret generated. A client would then authenticate
  # as a principal the broker has never heard of. Asserted by a test.
  topicOperator:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 384Mi
  userOperator:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 384Mi
