{{- if .Values.ui.enabled }}
{{- /*
  AKHQ. Deployment + ClusterIP Service + its config, and deliberately NO
  Ingress — see the comment on ui.service in values.yaml.

  Apache-2.0 and multi-arch (arm64 confirmed against the registry manifest,
  which matters: every node here is Graviton and an amd64-only image would
  CrashLoop with an exec format error rather than failing to schedule).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Restart on a config change; a ConfigMap edit alone does not roll the
        # pod, and AKHQ reads this only at startup.
        checksum/config: {{ include (print $.Template.BasePath "/kafka-ui-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: akhq
          image: {{ .Values.ui.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # MICRONAUT_CONFIG_FILES, not AKHQ_CONFIGURATION.
            #
            # AKHQ_CONFIGURATION holds the config *contents*, and the image's
            # entrypoint writes them to /app/application.yml. Pointing it at a
            # path and mounting the ConfigMap there makes the entrypoint try to
            # overwrite a read-only volume, and the container dies with
            # "cannot create /app/application.yml: Read-only file system"
            # before AKHQ starts. AKHQ is a Micronaut app, so this variable
            # loads the file in place with nothing to write.
            - name: MICRONAUT_CONFIG_FILES
              value: /config/application.yml
            - name: JAVA_OPTS
              value: "-Xmx{{ .Values.ui.jvm.xmx }}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            # A directory, not a subPath onto a file in the image's own
            # working dir — see the note on MICRONAUT_CONFIG_FILES above.
            - name: config
              mountPath: /config
              readOnly: true
          # /ui, NOT /health.
          #
          # AKHQ serves no health endpoint: /health is a 404, and setting
          # Micronaut's endpoints.health.enabled does not change that. The
          # failure this caused is worth remembering — the server logged
          # "Startup completed", served the UI correctly, and the kubelet killed
          # it at exactly failureThreshold x periodSeconds anyway, so the logs
          # showed a clean boot and the pod still CrashLooped. Verified paths:
          # /ui and /api are 200, / is a 307, everything else 404s.
          #
          # AKHQ starts a JVM and connects to Kafka before serving; a startup
          # probe gives it that time without a slack liveness threshold that
          # would then be slow to notice a genuinely wedged process.
          startupProbe:
            httpGet: { path: /ui, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ui, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ui, port: http }
            periodSeconds: 20
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-kafka-ui
{{- end }}
