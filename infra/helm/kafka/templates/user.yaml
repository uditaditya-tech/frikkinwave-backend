{{- /*
  The application's Kafka identity.

  Strimzi generates a Secret named after this user. Under mTLS it holds
  user.crt/user.key — a client certificate signed by the cluster CA, issued and
  renewed by the operator. The private key never leaves the cluster, is never in
  git, never in helm values, and never in Terraform state. That matters here
  specifically: this repository is PUBLIC.

  The principal Kafka authorizes is the certificate's subject, CN=<user>, so the
  ACLs below attach to something unforgeable rather than to a string anyone
  holding a Secret could replay.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .Values.appUser }}
  namespace: {{ .Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.clusterName }}
spec:
  authentication:
    # Must match the listener's authType — a KafkaUser authenticating a way the
    # listener does not accept is created happily and simply never connects.
    type: {{ .Values.security.authType }}
  authorization:
    type: simple
    acls:
{{- range .Values.topics }}
      # Produce and consume this topic, and read its metadata. Deliberately no
      # Delete and no Alter: topics are KafkaTopic manifests reconciled by the
      # Topic Operator, so an application that could change them would be able
      # to drift the cluster away from what is in git.
      - resource:
          type: topic
          name: {{ . | quote }}
          patternType: literal
        operations: [Read, Write, Describe]
      # And its dead-letter topic. Without this the consumer's dead-letter
      # produce is DENIED, the handler raises, and the partition stalls on the
      # very message the DLT exists to move past — turning the safety valve into
      # the outage it was meant to prevent.
      - resource:
          type: topic
          name: {{ printf "%s%s" . $.Values.dltSuffix | quote }}
          patternType: literal
        operations: [Read, Write, Describe]
{{- end }}
      # Consumer groups. A prefix so each extracted service gets its own group
      # without an ACL change per service.
      - resource:
          type: group
          name: {{ .Values.consumerGroupPrefix | quote }}
          patternType: prefix
        operations: [Read, Describe]
