{{- /*
  API VERSION: kafka.strimzi.io/v1, NOT v1beta2.

  Strimzi 1.1.0 serves only v1 — v1beta2 was removed, not merely deprecated.
  Essentially every Strimzi example in circulation is still v1beta2 and will be
  rejected outright by the API server. Verified against the chart's own CRDs.

  The same graduation moved `replicas` and `storage` off spec.kafka entirely:
  in v1 they exist ONLY on KafkaNodePool, and spec.kafka requires just
  `listeners`. Node pools and KRaft are no longer opt-in.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.nodePool.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    # This label is what binds the pool to its Kafka. A typo here does not
    # error — the pool is simply owned by no cluster and nothing is created.
    strimzi.io/cluster: {{ .Values.clusterName }}
spec:
  replicas: {{ .Values.nodePool.replicas }}
  roles:
{{ toYaml .Values.nodePool.roles | indent 4 }}
  storage:
    # jbod even for a single volume: converting a persistent-claim to jbod later
    # is not an in-place change, so starting here keeps adding a disk a matter
    # of appending an entry.
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.storage.size }}
        class: {{ .Values.storage.class }}
        deleteClaim: {{ .Values.storage.deleteClaim }}
        # KRaft metadata log shares this volume rather than demanding its own.
        kraftMetadata: shared
  resources:
{{ toYaml .Values.resources | indent 4 }}
  jvmOptions:
    -Xms: {{ .Values.jvm.xms }}
    -Xmx: {{ .Values.jvm.xmx }}
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topology.nodeSpread }}
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.clusterName }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topology.zoneSpread }}
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.clusterName }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.clusterName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Still declared explicitly even though v1 makes both mandatory: they cost
    # nothing and they state the intent for anyone reading this who last used
    # Strimzi when ZooKeeper was the default.
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafkaVersion | quote }}
    listeners:
      # TLS + mTLS client certificates. This replaced a plaintext listener with
      # no authentication, on which any pod in the cluster could read every topic.
      #
      # networkPolicyPeers is the SECOND layer. Strimzi's generated policy leaves
      # a listener unrestricted (`from: null`) unless this is set — which is
      # exactly why enabling NetworkPolicy enforcement alone would not have
      # closed the hole.
      - name: {{ .Values.security.listenerName }}
        port: {{ .Values.security.listenerPort }}
        type: internal
        tls: true
        authentication:
          type: {{ .Values.security.authType }}
        networkPolicyPeers:
{{- range .Values.security.allowedNamespaces }}
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ . }}
{{- end }}
{{- if .Values.metrics.enabled }}
    # Broker JMX metrics. Answers "why is lag climbing" — the exporter below
    # only answers "it is".
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ .Values.clusterName }}-metrics
          key: broker.yml
{{- end }}
    # DENY BY DEFAULT. An authenticated client with no ACLs can do nothing.
    # Strimzi adds its own operators to super.users, so the Topic Operator keeps
    # working — it talks over the internal 9091 listener regardless.
    authorization:
      type: simple
    config:
      # Topics created without an explicit replication factor.
      default.replication.factor: {{ .Values.durability.replicationFactor }}
      min.insync.replicas: {{ .Values.durability.minInsyncReplicas }}
      # Kafka's OWN internal topics do not inherit the defaults above — they are
      # configured separately and default to 1 on a fresh cluster. Consumer
      # offsets surviving a broker loss depends on this line, not on the one
      # above it.
      offsets.topic.replication.factor: {{ .Values.durability.replicationFactor }}
      transaction.state.log.replication.factor: {{ .Values.durability.replicationFactor }}
      transaction.state.log.min.isr: {{ .Values.durability.minInsyncReplicas }}
{{- if .Values.metrics.enabled }}
  # Consumer lag. Strimzi runs this as its own Deployment and it is the ONLY
  # source of kafka_consumergroup_lag here.
  kafkaExporter:
    groupRegex: {{ .Values.metrics.groupRegex | quote }}
    topicRegex: {{ .Values.metrics.topicRegex | quote }}
    resources:
{{ toYaml .Values.metrics.exporterResources | indent 6 }}
{{- end }}
{{- if .Values.entityOperator.enabled }}
  entityOperator:
    topicOperator:
      resources:
{{ toYaml .Values.entityOperator.topicOperator.resources | indent 8 }}
    # Required for the KafkaUser above to exist in Kafka at all — see values.yaml.
    userOperator:
      resources:
{{ toYaml .Values.entityOperator.userOperator.resources | indent 8 }}
{{- end }}
