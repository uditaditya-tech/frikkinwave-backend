{{- if .Values.ui.enabled }}
{{- /*
  AKHQ's configuration, in its OWN template file so the Deployment can hash it
  (see checksum/config there). Kubernetes does not restart pods when a
  ConfigMap changes and AKHQ reads config only at startup, so without that
  hash a config-only change deploys cleanly and does nothing.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  application.yml: |
    akhq:
      connections:
        {{ .Values.clusterName }}:
          properties:
            # The Strimzi-generated bootstrap Service. Plaintext internal
            # listener — there is no TLS on this cluster and no route into it
            # from outside, so there is nothing here to authenticate against.
            bootstrap.servers: "{{ .Values.clusterName }}-kafka-bootstrap:9092"
      security:
        # No login. Safe ONLY because the Service is ClusterIP and reachable
        # solely through kubectl port-forward, which is itself authenticated by
        # the cluster. Expose this and that assumption collapses.
        default-group: {{ if .Values.ui.readOnly }}reader{{ else }}admin{{ end }}
      server:
        access-log:
          enabled: false
    # Micronaut's management endpoints are DISABLED by default, so /health
    # returns a 404 that looks exactly like a healthy-but-wrong-path probe:
    # the server logs "Startup completed", serves the UI fine, and the kubelet
    # kills it after failureThreshold anyway. Enabling this is what makes the
    # probes below mean anything.
    endpoints:
      health:
        enabled: true
        sensitive: false
        details-visible: ANONYMOUS
{{- end }}
