repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates are Go templates that happen to end in .yaml — the
        # {{- ... }} directives are not valid YAML until rendered. `helm lint`
        # and `helm template` in infra/scripts/app-deploy.sh check them properly.
        exclude: ^infra/helm/.*/templates/
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
