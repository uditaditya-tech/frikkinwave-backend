name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image so migrations can CREATE EXTENSION vector (Phase 2).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frikkinwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Added before anything reads it, so a bad container config surfaces in
      # the commit that introduces the container rather than in the one that
      # starts depending on it.
      opensearch:
        image: opensearchproject/opensearch:3.7.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/frikkinwave_test
      OPENSEARCH_URL: http://localhost:9200
      DJANGO_SETTINGS_MODULE: config.settings.local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Without this the cache key is computed from a glob that matches
          # nothing, so it never invalidates and never actually caches — the
          # action warns about it on every run. Both files matter: dev.txt
          # includes base.txt, so a change to either must bust the cache.
          cache-dependency-glob: "requirements/*.txt"

      - name: Install dependencies
        # dev.txt, which pulls in base.txt. The production image installs
        # base.txt ALONE — that is what keeps pytest, mypy, ruff and the stubs
        # out of every running pod.
        run: uv pip install --system -r requirements/dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy apps/ config/
        continue-on-error: true  # Remove once stubs are fully configured

      - name: Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: pytest
